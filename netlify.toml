[build]
  command       = "pnpm install --frozen-lockfile && pnpm --filter @carbon/echarts-theme build && pnpm --filter @carbon/echarts-toolbar build && pnpm --filter @carbon/echarts-theme-site build"
  publish       = "packages/site/dist"
  base          = "."

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "9"

# Deploy preview for every pull request (Netlify enables this automatically,
# but this block makes the context explicit)
[context.deploy-preview]
  command = "pnpm install --frozen-lockfile && pnpm --filter @carbon/echarts-theme build && pnpm --filter @carbon/echarts-toolbar build && pnpm --filter @carbon/echarts-theme-site build"
