name: Publish to npm

on:
  push:
    # Release Please tags packages as `theme-v0.2.0`
    tags: ['theme-v*', 'toolbar-v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - name: Resolve package path from tag
        id: pkg
        run: |
          # Tag format: <component>-v<version> e.g. toolbar-v0.1.0, theme-v0.3.0
          COMPONENT="${GITHUB_REF_NAME%%-v*}"
          echo "path=packages/${COMPONENT}" >> "$GITHUB_OUTPUT"
          echo "name=@carbon/echarts-${COMPONENT}" >> "$GITHUB_OUTPUT"
      - run: pnpm --filter "${{ steps.pkg.outputs.path }}" build
      - run: pnpm --filter "${{ steps.pkg.outputs.path }}" test
      - name: Publish to npm under `next` dist-tag
        run: pnpm --filter "${{ steps.pkg.outputs.path }}" publish --tag next --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CARBON_BOT_NPM_TOKEN }}

  promote:
    needs: publish
    # Only promote to `latest` if this is not a release candidate tag
    if: ${{ !contains(github.ref_name, '-rc') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - name: Resolve package name from tag
        id: pkg
        run: |
          COMPONENT="${GITHUB_REF_NAME%%-v*}"
          echo "name=@carbon/echarts-${COMPONENT}" >> "$GITHUB_OUTPUT"
      - name: Promote package to `latest`
        run: |
          pkg="${{ steps.pkg.outputs.name }}"
          version=$(npm view $pkg@next version)
          npm dist-tag add $pkg@$version latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CARBON_BOT_NPM_TOKEN }}
