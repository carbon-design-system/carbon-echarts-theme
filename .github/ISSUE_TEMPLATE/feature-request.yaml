name: Feature request or enhancement 💡
description: Suggest a new chart type, theme option, preset helper, or other improvement.
title: '[Feature]: '
type: enhancement
labels: ['type: enhancement 💡']

body:
  - type: markdown
    attributes:
      value: |
        Use this template to request a new feature or improvement.
        For bugs, use the bug report template instead.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What gap or friction are you experiencing?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: The solution
      description: What would you like to see? Include examples or references where possible.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project does this affect?
      multiple: true
      options:
        - 'Theme tokens / colours'
        - 'Chart preset helper'
        - 'New chart type (Carbon Charts parity)'
        - 'New chart type (ECharts-extended)'
        - 'Codemod / migration'
        - 'Showcase site'
        - 'Documentation'
        - 'CI / release'
        - "I'm not sure"
    validations:
      required: true

  - type: input
    id: project
    attributes:
      label: Project or team
      description: What product or team would benefit from this?

  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](../../blob/main/.github/CODE_OF_CONDUCT.md)
          required: true
